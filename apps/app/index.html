<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Curling Timer X - Experimental</title>
    <link rel="stylesheet" href="/src/new-style.css">
</head>
<body>
    <!-- New Experimental Timer Screen -->
    <div id="new-main-screen" class="screen">
        <header class="header">
            <h1 class="app-title">Curling Predictor</h1>
            <div id="zone-display" class="zone-display">
                <span class="zone-icon">🎯</span>
                <span class="zone-label">Draw</span>
            </div>
        </header>

        <main class="main-content">
            <!-- Top Section: Curling Sheet Visualization -->
            <section class="visualization-section">
                <!-- NOTE: Canvas width/height must match CSS max-width/max-height in new-style.css -->
                <canvas id="rink-canvas" width="120" height="180" class="rink-canvas"></canvas>
                <div class="info-panel">
                    <div class="info-item">
                        <div class="info-label">Time</div>
                        <div id="info-time" class="info-value">0.000s</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Zone</div>
                        <div id="info-zone" class="info-value">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Distance</div>
                        <div id="info-distance" class="info-value">-</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">+Sweep</div>
                        <div id="info-swept" class="info-value">-</div>
                    </div>
                </div>
            </section>

            <!-- Zone Selection -->
            <section class="zone-section">
                <button id="zone-guard" class="zone-button">
                    <span class="zone-icon">🛡️</span>
                    <span class="zone-name">Guard</span>
                </button>
                <button id="zone-draw" class="zone-button active">
                    <span class="zone-icon">🎯</span>
                    <span class="zone-name">Draw</span>
                </button>
                <button id="zone-takeout" class="zone-button">
                    <span class="zone-icon">❌</span>
                    <span class="zone-name">Takeout</span>
                </button>
            </section>

            <!-- Feedback Section: Sweep Recommendation & Score -->
            <section class="feedback-section">
                <div id="sweep-recommendation" class="sweep-recommendation"></div>
                <div id="score-indicator" class="score-indicator"></div>
            </section>

            <!-- Calibration Slider Section -->
            <section class="calibration-section" style="display: none;">
                <label class="calibration-label">Calibration: Actual Distance</label>
                <input 
                    type="range" 
                    id="calibration-slider" 
                    class="calibration-slider" 
                    min="0" 
                    max="100" 
                    value="50"
                >
                <div id="calibration-value" class="calibration-value">Move to calibrate</div>
            </section>

            <!-- Bottom Section: Timer & Control -->
            <section class="control-section">
                <div id="new-timer-display" class="timer-display">0.000s</div>
                <button id="new-start-button" class="start-button">
                    <span class="button-text">PRESS<br>& HOLD</span>
                </button>
            </section>
        </main>

        <footer class="footer">
            <div class="calibration-info">
                Cal: <span id="cal-samples">0</span> samples
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="/src/new-main.js"></script>
</body>
</html>
