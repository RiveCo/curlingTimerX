<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Curling Timer X</title>
    <link rel="stylesheet" href="/src/new-style.css">
    <link rel="stylesheet" href="/src/home-style.css">
</head>
<body>
    <!-- Home Screen (Stopwatch Style) -->
    <div id="home-screen" class="screen" style="display: block;">
        <header class="header home-header">
            <h1 class="app-title">Stop Watch</h1>
            <div class="home-header-right">
                <div class="home-samples-info">
                    <span id="home-cal-samples">0</span> samples
                </div>
                <button id="home-reset-calibration" class="home-reset-button" title="Reset calibration to defaults">Reset</button>
                <button id="nav-to-advanced" class="nav-button" title="Advanced View">⚙️</button>
            </div>
        </header>

        <main class="home-main">
            <!-- Vertical scale with lines (left side) -->
            <div class="scale-container scale-left">
                <div class="scale-line hog-line"></div>
                <div class="scale-line intermediate-line center-line-1"></div>
                <div class="scale-line front-house-line"></div>
                <div class="scale-line intermediate-line center-line-2"></div>
                <div class="scale-line back-line"></div>
            </div>
            
            <!-- Vertical scale with lines (right side) -->
            <div class="scale-container scale-right">
                <div class="scale-line hog-line"></div>
                <div class="scale-line intermediate-line center-line-1"></div>
                <div class="scale-line front-house-line"></div>
                <div class="scale-line intermediate-line center-line-2"></div>
                <div class="scale-line back-line"></div>
            </div>
            
            <!-- Draggable position indicators (left side) -->
            <div id="home-predicted-pos" class="position-indicator predicted left"></div>
            <div id="home-swept-pos" class="position-indicator swept left"></div>
            
            <!-- Draggable position indicators (right side) -->
            <div id="home-predicted-pos-right" class="position-indicator predicted right"></div>
            <div id="home-swept-pos-right" class="position-indicator swept right"></div>

            <!-- Center time display -->
            <div class="center-content">
                <div id="home-time-display" class="home-time-display" data-zone="draw">0.000s</div>
                <div id="home-sweep-percentage" class="sweep-percentage">0.00</div>
            </div>

            <!-- Touch area for timer control -->
            <div id="home-timer-touch-area" class="timer-touch-area"></div>
        </main>
    </div>

    <!-- Advanced Screen (Original Experimental Timer) -->
    <div id="new-main-screen" class="screen" style="display: none;">
        <header class="header">
            <h1 class="app-title">Curling Predictor</h1>
            <button id="nav-to-home" class="nav-button" title="Home View">🏠</button>
            <div id="zone-display" class="zone-display">
                <span class="zone-icon">🎯</span>
                <span class="zone-label">Draw</span>
            </div>
        </header>

        <main class="main-content">
            <!-- Full Height Canvas + Side Panel -->
            <section class="visualization-section">
                <!-- Canvas takes full height -->
                <canvas id="rink-canvas" width="80" height="230" class="rink-canvas"></canvas>
                
                <!-- Right side panel with all controls -->
                <div class="side-panel">
                    <!-- Info Items -->
                    <div class="info-compact">
                        <div class="info-row">
                            <span class="info-label">Time:</span>
                            <span id="info-time" class="info-value">0.000s</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Zone:</span>
                            <span id="info-zone" class="info-value">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Dist:</span>
                            <span id="info-distance" class="info-value">-</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">+Swp:</span>
                            <span id="info-swept" class="info-value">-</span>
                        </div>
                    </div>

                    <!-- Zone Selection -->
                    <div class="zone-section">
                        <button id="zone-guard" class="zone-button">
                            <span class="zone-icon">🛡️</span>
                        </button>
                        <button id="zone-draw" class="zone-button active">
                            <span class="zone-icon">🎯</span>
                        </button>
                        <button id="zone-takeout" class="zone-button">
                            <span class="zone-icon">❌</span>
                        </button>
                    </div>

                    <!-- Feedback -->
                    <div class="feedback-section">
                        <div id="sweep-recommendation" class="sweep-recommendation"></div>
                        <div id="score-indicator" class="score-indicator"></div>
                    </div>

                    <!-- Timer & Control -->
                    <div class="control-section">
                        <div id="new-timer-display" class="timer-display">0.000s</div>
                        <button id="new-start-button" class="start-button">
                            <span class="button-text">PRESS<br>& HOLD</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="calibration-info">
                Cal: <span id="cal-samples">0</span> samples
                <button id="reset-calibration" class="reset-button" title="Reset calibration to defaults">Reset</button>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module" src="/src/app-init.js"></script>
</body>
</html>
